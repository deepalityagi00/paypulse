[project]
name = "paypulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "cryptography>=48.0.0",
    "django>=6.0.5",
    "django-celery-beat>=2.9.0",
    "django-rest-framework>=0.1.0",
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "gunicorn>=26.0.0",
    "langchain-openai>=1.2.1",
    "openai>=2.37.0",
    "psycopg2-binary>=2.9.12",
    "python-decouple>=3.8",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "stripe>=15.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
# Django settings live in backend/config; add backend to sys.path so
# `config.settings` is importable when pytest runs from the repo root.
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
